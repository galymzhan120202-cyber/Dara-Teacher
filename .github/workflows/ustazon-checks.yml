name: Ustazon checks
on:
  push:
    paths: ['ustazon/**', 'package.json', '.github/workflows/ustazon-*.yml']
  pull_request:
    paths: ['ustazon/**', 'package.json', '.github/workflows/ustazon-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ustazon/package-lock.json
      - run: npm ci --prefix ustazon
      - run: npm run test:ustazon
      - run: npm run video:check
